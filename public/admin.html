<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NAICTS INFOHUB — Admin Login</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

  <div id="login" class="screen">
    <div class="login-card">

      <img src="/assets/naicts-logo.jpg" alt="NAICTS">

      <span class="eyebrow">PROTECTED CMS</span>

      <h1>NAICTS INFOHUB</h1>

      <p>Authorized administrators only.</p>

      <form id="loginForm">

        <input
          id="email"
          type="email"
          placeholder="Admin email"
          autocomplete="username"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Sign in</button>

        <div id="loginError" class="login-error" role="alert" hidden>
          <strong>Unauthorized access detected</strong>
          <span>Input the right credentials to continue.</span>
        </div>

      </form>

    </div>
  </div>

  <script src="/js/admin.js"></script>

</body>
</html>
